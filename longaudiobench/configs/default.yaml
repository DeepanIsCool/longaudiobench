# LongAudioBench Configuration

# Task configurations
tasks:
  anih:
    background_duration: 3600  # 1 hour
    needle_duration: 0.5
    needle_types:
      - "glass_shatter"
      - "pen_click"
      - "phone_notification"
      - "door_slam"
      - "keyboard_click"
    insertion_depths: []  # random if empty
    snr_db: 10.0
    background_sources:
      - "library"
      - "office"
      - "lecture"
    num_instances: 100
  
  speaker_drift:
    total_duration: 3600  # 60 minutes
    num_speakers: 5
    target_speaker_id: 2
    initial_speech_duration: 120
    silence_duration: 2400
    final_speech_time: 2595
    final_speech_duration: 10
    speaker_similarity: "high"
    dataset_sources:
      - "voxceleb2"
      - "ami"
      - "librispeech"
    num_instances: 50
  
  soundscape:
    duration: 1800  # 30 minutes
    num_events: 8
    overlap_allowed: true
    min_event_duration: 10
    max_event_duration: 120
    dataset_sources:
      - "audioset"
      - "fsd50k"
      - "dcase2024"
    num_instances: 50
  
  narrative_coherence:
    duration: 2400  # 40 minutes
    story_sources:
      - "librivox"
      - "spotify_podcasts"
      - "gigaspeech"
    clue_types:
      - "clock_chime"
      - "distinctive_bell"
      - "unique_bird_call"
      - "train_whistle"
      - "church_bell"
      - "factory_whistle"
    reasoning_depth: 3
    num_instances: 30

# Model configurations
models:
  whisper_llama3:
    model_type: "cascaded"
    model_path: "meta-llama/Meta-Llama-3-8B-Instruct"
    device: "cuda"
    max_audio_length: 3600
    generation_config:
      max_new_tokens: 512
      temperature: 0.1
      top_p: 0.9
  
  salmonn:
    model_type: "native"
    model_path: "salmonn/salmonn-7b"
    device: "cuda"
    max_audio_length: 3600
    generation_config:
      max_new_tokens: 512
      temperature: 0.1
      top_p: 0.9
  
  qwen_audio:
    model_type: "native"
    model_path: "Qwen/Qwen-Audio-Chat"
    device: "cuda"
    max_audio_length: 3600
    generation_config:
      max_new_tokens: 512
      temperature: 0.1
      top_p: 0.9
  
  ltu:
    model_type: "native"
    model_path: "LTU/LTU-7B"
    device: "cuda"
    max_audio_length: 3600
    generation_config:
      max_new_tokens: 512
      temperature: 0.1
      top_p: 0.9

# Evaluation settings
evaluation:
  output_dir: "results"
  save_predictions: true
  compute_ci: true
  n_bootstrap: 10000
  confidence: 0.95

# Data paths (to be filled by user)
data:
  audioset_path: "/path/to/audioset"
  fsd50k_path: "/path/to/fsd50k"
  voxceleb2_path: "/path/to/voxceleb2"
  ami_path: "/path/to/ami"
  librispeech_path: "/path/to/librispeech"
  librivox_path: "/path/to/librivox"
  spotify_podcasts_path: "/path/to/spotify_podcasts"
  gigaspeech_path: "/path/to/gigaspeech"
  dcase2024_path: "/path/to/dcase2024"